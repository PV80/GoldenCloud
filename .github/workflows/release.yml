name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.25"
  DOTNET_VERSION: "8.0.x"

jobs:
  server:
    name: Build server binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      # Pin the exact commit this run was started on. On workflow_dispatch the
      # default checkout re-resolves the branch, so a push racing the release
      # could otherwise change what gets built mid-run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Determine version
        id: v
        shell: bash
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.v.outputs.version }}" \
            -o "../dist/goldencloud-server-linux-${{ matrix.goarch }}" \
            ./cmd/goldencloud
      - name: Checksum
        working-directory: dist
        run: sha256sum "goldencloud-server-linux-${{ matrix.goarch }}" > "goldencloud-server-linux-${{ matrix.goarch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  client:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Determine version
        id: v
        shell: pwsh
        run: |
          # build.ps1 wants a bare dotted version ("0.2.0"), not a tag ("v0.2.0").
          $tag = "${{ inputs.tag || github.ref_name }}"
          "version=$($tag -replace '^v','')" | Out-File -Append $env:GITHUB_OUTPUT
      - name: Warn if server URL is not configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ vars.GOLDENCLOUD_SERVER_URL }}")) {
            Write-Host "::warning::Repository variable GOLDENCLOUD_SERVER_URL is not set. See PROGRESS.md, human gate 2. The installer will be built as an UNCONFIGURED build."
          }
      - name: Publish
        working-directory: client
        env:
          GOLDENCLOUD_SERVER_URL: ${{ vars.GOLDENCLOUD_SERVER_URL }}
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Version "${{ steps.v.outputs.version }}"
      - name: Package installer
        working-directory: client
        shell: pwsh
        run: ./package.ps1 -Version "${{ steps.v.outputs.version }}"
      - name: Checksum
        shell: pwsh
        run: |
          $p = "client/installer/Output/GoldenCloudSetup.exe"
          (Get-FileHash $p -Algorithm SHA256).Hash.ToLower() + "  GoldenCloudSetup.exe" |
            Out-File -Encoding ascii "client/installer/Output/GoldenCloudSetup.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: client-installer
          path: client/installer/Output/GoldenCloudSetup.exe*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artefacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # On a dispatched run the tag does not exist yet and would otherwise
          # be created at the branch tip at *publish* time — which can be a
          # different commit than the one the artefacts were built from. Mint
          # it at exactly the built commit. Ignored when the tag already exists.
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: release/*
          body: |
            ## GoldenCloud ${{ inputs.tag || github.ref_name }}

            | Artefact | Install on |
            | --- | --- |
            | `goldencloud-server-linux-arm64` | Raspberry Pi 5 (64-bit Raspberry Pi OS) |
            | `goldencloud-server-linux-amd64` | Mini-PC / any 64-bit Intel or AMD Linux box |
            | `GoldenCloudSetup.exe` | Staff Windows 10 22H2 / Windows 11 PCs |

            Server setup: `deploy/RUNBOOK.md`.
            Client test checklist: `docs/CLIENT-TEST.md`.

            Verify a download with the matching `.sha256` file.
